{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Outfit:wght@100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{% static "css/styles.css" %}">
    <title>FastQuest | Questions</title>
</head>

<body data-csrf="{{csrf_token}}">
    <header>
        <h1>Fast Quest</h1>
        <div id="headerbutton">
            <button onclick="window.location.href='/'">Home</button>
            <button id="logout">Log Out</button>
        </div>
    </header>
    <section id="recents">
        <h2>{{username}}'s Questions Generated</h2>
        <div id="question-container">
            <div id="emptycard">
                <h5>Loading Question...</h5>
            </div>
        </div>
    </section>
    <script src="{% static "js/questions.js" %}"></script>
</body>

</html>
