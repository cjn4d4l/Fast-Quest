{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Outfit:wght@100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{% static "css/styles.css" %}">
    <title>FastQuest | Questions</title>
</head>

<body data-csrf="{{csrf_token}}">
    {% if user_id is not None %}
        <header>
            <h1>Fast Quest</h1>
            <div id="headerbutton">
                <button onclick="window.location.href='/topics/'">Topics</button>
                <button id="logout">Log Out</button>
            </div>
        </header>
        <section id="recents">
            <h2>{{topic}} Questions</h2>
            <div id="question-container">
                {% for q in questions %}
                    <div class="qcard">
                        <strong>{{q.question}}</strong>
                        <p> - {{q.correct_answer}} </p>
                    </div>
                {% endfor %}
            </div>
        </section>
    {% else %}
    <a href="/userlogin/">Go Back</a>
    {% endif %}
</body>

</html>
