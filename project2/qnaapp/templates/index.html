{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Outfit:wght@100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{% static "css/styles.css" %}">
    <title>FastQuest</title>
</head>

<body data-csrf="{{csrf_token}}">
    {% if user_id is not None %}
    <header>
        <h1>Fast Quest</h1>
        <div id="headerbutton">
            <button onclick="window.location.href='/topics/'">View All Topics</button>
            <button id="logout">Log Out</button>
        </div>
    </header>
    <section id="hero">
        <h1>Good Day, {{username}}!</h1>
        <p>Generate Questions on Topics that come to mind!</p>
        <div id="main">
            <input type="text" id="topic" placeholder="Do you have a Topic in mind?">
            <button id="createBtn">Create</button>
        </div>
        <div id="extra">
            <label>
                Number of Questions to be Generated <input type="number" id="count" value=1 min=1 max=20>
            </label>
        </div>
    </section>
    <div id="container">
    </div>
    <section id="recents">
        <h3>Recent Topics</h3>
        <div id="topic-container">
            <div id="emptycard">
                <h5>Loading Topics...</h5>
            </div>
        </div>
    </section>
    <script src="{% static "js/index.js" %}"></script>
    {% else %}
    <header>
        <h1>Fast Quest</h1>
        <div id="headerbutton">
            <button onclick="window.location.href='/userlogin/'">Log In</button>
        </div>
    </header>
    <section id="hero">
        <h1>Good Day, Visitor!</h1>
        <p>Generate Questions on Topics that come to mind!</p>
        <div id="main">
            <input type="text" id="topic" placeholder="Please Login an Account Before Using FastQuest" readonly>
            <button id="createBtn" disabled>Create</button>
        </div>
    </section>
    {% endif %}
</body>

</html>
